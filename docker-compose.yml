services:
  backend:
    image: townsquare-backend
    build: ./server
    restart: unless-stopped
    environment:
      # 与前端 package.json 版本保持一致，避免客户端弹更新提示
      APP_VERSION: 3.3.1
      # HOST_GRACE_MS: 90000
    volumes:
      - avatars:/app/avatars

  frontend:
    image: townsquare-frontend
    build: .
    restart: unless-stopped
    environment:
      # 你的域名或服务器 IP（不带协议；非标准端口可带上，如 example.com:8080）
      DOMAIN: localhost
      # http 或 https；https 时前端自动改用 wss
      SCHEME: http
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  avatars:
